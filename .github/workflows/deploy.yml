name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede an older queued deploy rather than waiting behind it. A stuck run
# in the shared "pages" group previously blocked every subsequent deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The worker is deployed to Cloudflare, not served from the site.
      # Dropping it here only affects the runner's checkout, never the repo.
      - name: Strip non-site files from the artifact
        run: rm -rf waitlist-api

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
